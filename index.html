<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>English Journey - Lessons 1-10</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet"><style>body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,#e0c3fc,#8ec5fc);margin:0;padding:20px;color:#333}.c{max-width:900px;margin:auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.1)}h1{color:#6a11cb;text-align:center}h2{color:#2575fc;border-bottom:2px solid #e0c3fc;padding-bottom:10px}.u{border:2px dashed #6a11cb;border-radius:12px;padding:20px;text-align:center;margin-bottom:30px;background:#f8f9fa}.b{background:#6a11cb;color:#fff;border:none;padding:12px 24px;cursor:pointer;border-radius:8px;font-size:16px;font-weight:700;margin:5px;text-decoration:none;display:inline-block}.b:hover{background:#5a0fab}.card{background:#fdfdff;border-right:5px solid #8ec5fc;border-radius:8px;padding:20px;margin-bottom:20px}.card h3{color:#2c3e50;margin-top:0}.vi{background:#ecf0f1;padding:15px;margin:10px 0;border-radius:8px;border-left:4px solid #e67e22}.vi strong{color:#d35400}.tag{display:inline-block;padding:4px 8px;border-radius:4px;font-size:.9em;margin-right:5px;color:#fff}.th{background:#e67e22}.tp{background:#9b59b6}.yt{background:#e74c3c;color:#fff;padding:8px 16px;border-radius:6px;display:inline-block;margin-top:10px;font-weight:700;text-decoration:none}.voa{background:#27ae60;color:#fff;padding:10px 20px;border-radius:6px;display:inline-block;margin-top:10px;font-weight:700;text-decoration:none}.alert{background:#fff3cd;padding:15px;border-radius:8px;border-right:4px solid #ffc107;margin:10px 0}.qb{background:#e8f6f3;padding:10px;border-radius:6px;margin-top:10px}.qb em{color:#16a085;font-weight:700}select{padding:10px;font-size:16px;border-radius:8px;border:2px solid #6a11cb;margin:10px;font-family:'Tajawal',sans-serif}</style></head><body><div class="c"><h1>🚀 مسيرتي لتعلم اللغة الإنجليزية</h1><div class="u"><h3>اختر الدرس</h3><select id="ls" onchange="sl()"></select><br><input type="file" id="f" accept=".json" style="margin:10px;"><button class="b" onclick="l()">استيراد درس خارجي (JSON)</button></div><div id="ld"></div></div><script>const D=[{"lesson_id":1,"lesson_title":"الدرس 1: المضارع البسيط والمستمر","grammar":{"topic":"Present Simple vs Continuous","explanation_ar":"المضارع البسيط للعادات (every day)، والمستمر لحدوث الفعل الآن (now).","explanation_en":"Present Simple for habits. Present Continuous for actions happening now.","youtube_link":"https://www.youtube.com/watch?v=O1_GBJXkSYg","practice_questions":[{"question":"She (go) to school every day.","answer":"goes"},{"question":"Look! He (run).","answer":"is running"}]},"listening":{"instructions":"استمع لقطعة VOALevel 1 وطبق Shadowing.","voa_link":"https://learningenglish.voanews.com/z/3521"},"vocabulary":{"instructions":"احفظ الكلمات ومرادفاتها:","words":[{"word":"Important","meaning_ar":"مهم","heavy_synonym":"Crucial (حاسم)","phrasal_verb_synonym":"Boil down to (يختصر في)","example":"It is crucial to practice."},{"word":"Reduce","meaning_ar":"يقلل","heavy_synonym":"Diminish (يتناقص)","phrasal_verb_synonym":"Cut down on (يقلل من)","example":"Cut down on sugar."},{"word":"Understand","meaning_ar":"يفهم","heavy_synonym":"Comprehend (يدرك)","phrasal_verb_synonym":"Figure out (يفهم)","example":"Figure out the rule."}],"srs_note":"ستتكرر هذه الكلمات في دروس لاحقة."},"reading":{"instructions":"اقرأ القطعتين:","passage_1":"Tom wakes up early. He is reading now.","passage_2":"Sarah usually works, but today she is resting."},"production":{"writing_prompt":"اكتب 5 سطور عن روتينك باستخدام قاعدة اليوم.","speaking_prompt":"تحدث مع z.ai عن عاداتك اليومية."}},{"lesson_id":2,"lesson_title":"الدرس 2: الماضي البسيط والمستمر","grammar":{"topic":"Past Simple vs Continuous","explanation_ar":"الماضي البسيط لفعل انتهى. المستمر لفعل كان مستمراً في الماضي.","explanation_en":"Past Simple for finished actions. Past Continuous for actions in progress in the past.","youtube_link":"https://www.youtube.com/watch?v=4rBq0iYFWcI","practice_questions":[{"question":"I (see) him yesterday.","answer":"saw"},{"question":"While I (read), he called.","answer":"was reading"}]},"listening":{"instructions":"استمع لـ VOA Level 2 وطبق Shadowing.","voa_link":"https://learningenglish.voanews.com/z/3521"},"vocabulary":{"instructions":"الكلمات الجديدة:","words":[{"word":"Start","meaning_ar":"يبدأ","heavy_synonym":"Commence (يشرع)","phrasal_verb_synonym":"Kick off (يبدأ)","example":"The meeting commenced."},{"word":"Stop","meaning_ar":"يتوقف","heavy_synonym":"Cease (يكف)","phrasal_verb_synonym":"Wind down (يهدأ)","example":"Cease talking."},{"word":"Help","meaning_ar":"يساعد","heavy_synonym":"Facilitate (يسهل)","phrasal_verb_synonym":"Help out (يساعد)","example":"Facilitate the process."}],"srs_note":"مراجعة: استخدم crucial في جملة."},"reading":{"instructions":"اقرأ:","passage_1":"Yesterday, it rained. I was walking home.","passage_2":"She kicked off the project last week."},"production":{"writing_prompt":"اكتب عما كنت تفعله بالأمس.","speaking_prompt":"تحدث عن آخر مرة ساعدت فيها شخصاً."}},{"lesson_id":3,"lesson_title":"الدرس 3: المضارع التام والماضي البسيط","grammar":{"topic":"Present Perfect vs Past Simple","explanation_ar":"التام لفعل بدأ في الماضي ولا يزال له أثر. البسيط لفعل انتهى بوقت محدد.","explanation_en":"Present Perfect for past actions with present results. Past Simple for specific past time.","youtube_link":"https://www.youtube.com/watch?v=1JxjKZq8hY8","practice_questions":[{"question":"I (finish) my work.","answer":"have finished"},{"question":"I (finish) it yesterday.","answer":"finished"}]},"listening":{"instructions":"استمع لـ VOA وكرر.","voa_link":"https://learningenglish.voanews.com/z/3521"},"vocabulary":{"instructions":"كلمات جديدة:","words":[{"word":"Show","meaning_ar":"يُظهر","heavy_synonym":"Demonstrate (يبرهن)","phrasal_verb_synonym":"Point out (يشير إلى)","example":"Point out the mistake."},{"word":"Hide","meaning_ar":"يخفي","heavy_synonym":"Conceal (يطوي)","phrasal_verb_synonym":"Cover up (يغطي)","example":"Cover up the truth."},{"word":"Change","meaning_ar":"يغير","heavy_synonym":"Alter (يعدل)","phrasal_verb_synonym":"Bring about (يؤدي إلى)","example":"Bring about change."}],"srs_note":"تذكر كلمات الدرس السابق: Commence, Cease."},"reading":{"instructions":"اقرأ:","passage_1":"I have altered my plans. I pointed out the issue.","passage_2":"He has concealed the facts."},"production":{"writing_prompt":"اكتب عن تغيير حدث في حياتك.","speaking_prompt":"تحدث عن شيء أتممته مؤخراً."}},{"lesson_id":4,"lesson_title":"الدرس 4: المستقبل (will vs going to)","grammar":{"topic":"Future: will vs going to","explanation_ar":"will للقرارات اللحظية والتنبؤات. going to لنوايا وخطط مستقبلية.","explanation_en":"will for instant decisions. going to for plans.","youtube_link":"https://www.youtube.com/watch?v=7x0FW2bKq1A","practice_questions":[{"question":"I think it (rain).","answer":"will rain"},{"question":"We (travel) next week.","answer":"are going to travel"}]},"listening":{"instructions":"استماع VOA","voa_link":"https://learningenglish.voanews.com/z/3521"},"vocabulary":{"instructions":"كلمات:","words":[{"word":"Build","meaning_ar":"يبني","heavy_synonym":"Construct (يشيد)","phrasal_verb_synonym":"Put up (يقيم)","example":"Put up a building."},{"word":"Destroy","meaning_ar":"يدمر","heavy_synonym":"Annihilate (يبيد)","phrasal_verb_synonym":"Tear down (يهدم)","example":"Tear down the wall."},{"word":"Use","meaning_ar":"يستخدم","heavy_synonym":"Utilize (يوظف)","phrasal_verb_synonym":"Use up (يستنزف)","example":"Utilize resources."}],"srs_note":"استخدم Diminish في جملة."},"reading":{"instructions":"اقرأ:","passage_1":"They will construct a new school. They are going to utilize the land.","passage_2":"The storm annihilated the village."},"production":{"writing_prompt":"اكتب عن خططك للمستقبل.","speaking_prompt":"تحدث عما ستفعله في الإجازة."}},{"lesson_id":5,"lesson_title":"الدرس 5: أفعال القدرة والطلب (can/could)","grammar":{"topic":"Modals: can/could","explanation_ar":"can للقدرة في الحاضر. could للقدرة في الماضي أو للطلبات المهذبة.","explanation_en":"can for present ability. could for past ability or polite requests.","youtube_link":"https://www.youtube.com/watch?v=8-1JxjKZq8h","practice_questions":[{"question":"I (swim) when I was 5.","answer":"could swim"},{"question":"Can you (help) me?","answer":"help"}]},"listening":{"instructions":"استماع","voa_link":"https://learningenglish.voanews.com/z/3521"},"vocabulary":{"instructions":"كلمات:","words":[{"word":"Think","meaning_ar":"يفكر","heavy_synonym":"Consider (يدرس)","phrasal_verb_synonym":"Think over (يتأمل)","example":"Think over the offer."},{"word":"Know","meaning_ar":"يعرف","heavy_synonym":"Acknowledge (يسلم بـ)","phrasal_verb_synonym":"Be aware of (يدرك)","example":"Be aware of the risks."},{"word":"Guess","meaning_ar":"يخمن","heavy_synonym":"Estimate (يقدر)","phrasal_verb_synonym":"Narrow down (يقلص)","example":"Narrow down the choices."}],"srs_note":"راجع: Comprehend, Figure out."},"reading":{"instructions":"اقرأ:","passage_1":"She could read when she was 3. She is considered smart.","passage_2":"We estimated the cost."},"production":{"writing_prompt":"اكتب عما كنت تستطيع فعله وأنت طفل.","speaking_prompt":"تحدث عن مهارة تريد تعلمها."}},{"lesson_id":6,"lesson_title":"الدرس 6: أفعال النصيحة والالتزام","grammar":{"topic":"Modals: should/must/have to","explanation_ar":"should للنصيحة. must/have to للالتزام القوي.","explanation_en":"should for advice. must/have to for strong obligation.","youtube_link":"https://www.youtube.com/watch?v=7x0FW2bKq1B","practice_questions":[{"question":"You (stop) smoking.","answer":"should stop"},{"question":"I (wear) a uniform.","answer":"must wear"}]},"listening":{"instructions":"استماع","voa_link":"https://learningenglish.voanews.com/z/3521"},"vocabulary":{"instructions":"كلمات:","words":[{"word":"Buy","meaning_ar":"يشتري","heavy_synonym":"Purchase (يشتري رسمياً)","phrasal_verb_synonym":"Pay for (يدفع ثمن)","example":"Pay for the items."},{"word":"Sell","meaning_ar":"يبيع","heavy_synonym":"Retail (يبيع بالتجزئة)","phrasal_verb_synonym":"Sell out (ينفد)","example":"Tickets sold out."},{"word":"Need","meaning_ar":"يحتاج","heavy_synonym":"Require (يتطلب)","phrasal_verb_synonym":"Call for (يستدعي)","example":"The job calls for skill."}],"srs_note":"راجع: Facilitate, Help out."},"reading":{"instructions":"اقرأ:","passage_1":"You should purchase a new car. It requires maintenance.","passage_2":"They must sell out the stock."},"production":{"writing_prompt":"انصح صديقك باتباع عادة صحية.","speaking_prompt":"تحدث عن قاعدة إلزامية في عملك/دراستك."}},{"lesson_id":7,"lesson_title":"الدرس 7: الحالة الشرطية (الصفر والأولى)","grammar":{"topic":"Zero & First Conditional","explanation_ar":"الصفرى للحقائق. الأولى للمستقبل المحتمل.","explanation_en":"Zero for facts. First for possible future.","youtube_link":"https://www.youtube.com/watch?v=7x0FW2bKq1C","practice_questions":[{"question":"If you heat ice, it (melt).","answer":"melts"},{"question":"If it rains, we (stay) home.","answer":"will stay"}]},"listening":{"instructions":"استماع","voa_link":"https://learningenglish.voanews.com/z/3521"},"vocabulary":{"instructions":"كلمات:","words":[{"word":"Make","meaning_ar":"يصنع","heavy_synonym":"Manufacture (يصنع بكميات)","phrasal_verb_synonym":"Put together (يجمع)","example":"Put together the parts."},{"word":"Do","meaning_ar":"يفعل","heavy_synonym":"Execute (ينفذ)","phrasal_verb_synonym":"Carry out (ينجز)","example":"Carry out the task."},{"word":"Try","meaning_ar":"يحاول","heavy_synonym":"Attempt (يسعى)","phrasal_verb_synonym":"Go for (يخوض)","example":"Go for it."}],"srs_note":"راجع: Alter, Bring about."},"reading":{"instructions":"اقرأ:","passage_1":"If you execute the plan, you will succeed.","passage_2":"Water boils if you heat it."},"production":{"writing_prompt":"اكتب ماذا ستفعل إذا كان الجو جميلاً غداً.","speaking_prompt":"تحدث عن حقيقة علمية باستخدام الشرط الصفري."}},{"lesson_id":8,"lesson_title":"الدرس 8: المبني للمجهول (مضارع وماضي)","grammar":{"topic":"Passive Voice","explanation_ar":"المبني للمجهول عندما يكون الفعل أهم من الفاعل.","explanation_en":"Used when action is more important than the doer.","youtube_link":"https://www.youtube.com/watch?v=7x0FW2bKq1D","practice_questions":[{"question":"The book (write) in 1990.","answer":"was written"},{"question":"The room (clean) every day.","answer":"is cleaned"}]},"listening":{"instructions":"استماع","voa_link":"https://learningenglish.voanews.com/z/3521"},"vocabulary":{"instructions":"كلمات:","words":[{"word":"Keep","meaning_ar":"يحتفظ","heavy_synonym":"Maintain (يحافظ)","phrasal_verb_synonym":"Hold on to (يتمسك بـ)","example":"Hold on to the ticket."},{"word":"Remove","meaning_ar":"يزيل","heavy_synonym":"Eliminate (يبعد)","phrasal_verb_synonym":"Phase out (يستغني عن)","example":"Phase out old rules."},{"word":"Find","meaning_ar":"يجد","heavy_synonym":"Locate (يحدد موقع)","phrasal_verb_synonym":"Track down (يتعقب)","example":"Track down the file."}],"srs_note":"راجع: Utilize, Construct."},"reading":{"instructions":"اقرأ:","passage_1":"The car was manufactured in Japan.","passage_2":"Errors are eliminated by the system."},"production":{"writing_prompt":"اكتب عن شيء اخترع باستخدام المبني للمجهول.","speaking_prompt":"تحدث عن عملية تتم في حياتك اليومية بالمبني للمجهول."}},{"lesson_id":9,"lesson_title":"الدرس 9: الأسماء المعدودة وغير المعدودة","grammar":{"topic":"Countable & Uncountable Nouns","explanation_ar":"المعدودة يمكن عدها. غير المعدودة لا تجمع.","explanation_en":"Countable can be counted. Uncountable cannot.","youtube_link":"https://www.youtube.com/watch?v=7x0FW2bKq1E","practice_questions":[{"question":"I have (much/many) books.","answer":"many"},{"question":"There is (a/some) water.","answer":"some"}]},"listening":{"instructions":"استماع","voa_link":"https://learningenglish.voanews.com/z/3521"},"vocabulary":{"instructions":"كلمات:","words":[{"word":"Give","meaning_ar":"يعطي","heavy_synonym":"Provide (يوفر)","phrasal_verb_synonym":"Hand over (يسلم)","example":"Hand over the keys."},{"word":"Take","meaning_ar":"يأخذ","heavy_synonym":"Receive (يستلم)","phrasal_verb_synonym":"Take in (يستوعب)","example":"Take in information."},{"word":"Ask","meaning_ar":"يسأل","heavy_synonym":"Inquire (يستفسر)","phrasal_verb_synonym":"Ask around (يسأل الناس)","example":"Ask around for help."}],"srs_note":"راجع: Consider, Estimate."},"reading":{"instructions":"اقرأ:","passage_1":"She provided much information.","passage_2":"He received many letters."},"production":{"writing_prompt":"اكتب عما يوفره منزلك لك (استخدم much/many).","speaking_prompt":"تحدث عن الأشياء التي تحتاجها الكثير منها."}},{"lesson_id":10,"lesson_title":"الدرس 10: صيغة المقارنة والتفضيل","grammar":{"topic":"Comparatives & Superlatives","explanation_ar":"المقارنة بين شيئين. التفضيل بين أكثر من شيئين.","explanation_en":"Comparatives for 2 things. Superlatives for 3+ things.","youtube_link":"https://www.youtube.com/watch?v=7x0FW2bKq1F","practice_questions":[{"question":"He is (tall) than me.","answer":"taller"},{"question":"She is (smart) in class.","answer":"the smartest"}]},"listening":{"instructions":"استماع","voa_link":"https://learningenglish.voanews.com/z/3521"},"vocabulary":{"instructions":"كلمات:","words":[{"word":"Tell","meaning_ar":"يخبر","heavy_synonym":"Communicate (يوصل)","phrasal_verb_synonym":"Get across (يشرح)","example":"Get across the point."},{"word":"Talk","meaning_ar":"يتحدث","heavy_synonym":"Discuss (يناقش)","phrasal_verb_synonym":"Bring up (يطرح)","example":"Bring up the topic."},{"word":"Hear","meaning_ar":"يسمع","heavy_synonym":"Perceive (يدرك)","phrasal_verb_synonym":"Listen in (يستمع)","example":"Listen in to the news."}],"srs_note":"راجع: Require, Call for."},"reading":{"instructions":"اقرأ:","passage_1":"This is the most interesting book. He communicated it well.","passage_2":"She is taller than her brother."},"production":{"writing_prompt":"قارن بين مدينتين أو شخصين.","speaking_prompt":"تحدث عن أفضل تجربة مرت بك."}}];function p(L){let h=`<h2>${L.lesson_title}</h2><div class="card"><h3>📚 القواعد (Grammar)</h3><p style="font-weight:700;color:#6a11cb">الموضوع: ${L.grammar.topic}</p><p>${L.grammar.explanation_ar}</p><p style="direction:ltr;text-align:left">${L.grammar.explanation_en}</p><a class="yt" href="${L.grammar.youtube_link}" target="_blank">📺 شاهد شرح يوتيوب</a><div style="margin-top:15px"><h4>أسئلة الممارسة:</h4>`;L.grammar.practice_questions.forEach((q,i)=>{h+=`<div class="qb">${i+1}. ${q.question}<br><em>الإجابة: ${q.answer}</em></div>`});h+=`</div></div><div class="card"><h3>🎧 الاستماع (Listening)</h3><p>${L.listening.instructions}</p><a class="voa" href="${L.listening.voa_link}" target="_blank">🔗 اذهب لدرس VOA</a><div class="alert">عُد بعد الـ Shadowing لتعلم الكلمات!</div></div><div class="card"><h3>📝 الكلمات (Vocabulary)</h3><p>${L.vocabulary.instructions}</p>`;L.vocabulary.words.forEach(w=>{h+=`<div class="vi"><strong>${w.word}</strong> - ${w.meaning_ar}<br><span class="tag th">مرادف ثقيل</span> ${w.heavy_synonym}<br><span class="tag tp">فعل مركب</span> ${w.phrasal_verb_synonym}<br><em>مثال: ${w.example}</em></div>`});h+=`<p style="font-size:.9em;color:gray;margin-top:10px">${L.vocabulary.srs_note}</p></div><div class="card"><h3>📖 القراءة (Reading)</h3><p>${L.reading.instructions}</p><p style="direction:ltr;text-align:left;background:#f9f9f9;padding:10px;border-radius:5px">${L.reading.passage_1}</p><p style="direction:ltr;text-align:left;background:#f9f9f9;padding:10px;border-radius:5px">${L.reading.passage_2}</p></div><div class="card"><h3>✍️ إنتاج اللغة</h3><p><strong>الكتابة:</strong> ${L.production.writing_prompt}</p><p><strong>التحدث:</strong> ${L.production.speaking_prompt}</p><a href="https://z.ai" target="_blank" class="b" style="background:#2575fc">🤖 افتح z.ai للتقييم</a></div>`;document.getElementById('ld').innerHTML=h}function init(){const s=document.getElementById('ls');D.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.text=l.lesson_title;s.appendChild(o)});p(D[0])}function sl(){const s=document.getElementById('ls');p(D[s.value])}function l(){const f=document.getElementById('f');if(!f.files.length){alert("اختر ملف JSON");return}const r=new FileReader();r.onload=function(e){try{p(JSON.parse(e.target.result))}catch(e){alert("خطأ في الملف")}};r.readAsText(f.files[0])}window.onload=init;</script></body></html>
